rules:
  - id: debug-endpoint-left
    message: |
      Отладочный endpoint `debug` остаётся в продакшене и возвращает пароли пользователей.
      Уберите этот метод или защитите его.
    languages: [python]
    severity: WARNING
    pattern: |
      def debug():
          return jsonify({'users': User.get_all_users_debug()})
