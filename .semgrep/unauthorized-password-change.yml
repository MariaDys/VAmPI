rules:
  - id: unauthorized-password-change
    message: |
      Несанкционированное изменение пароля:
      пароль присваивается без проверки прав текущего пользователя.
      Используйте username из токена, а не из URL-параметра.
    languages: [python]
    severity: ERROR
    patterns:
      # сначала получаем user из запроса
      - pattern: |
          user = User.query.filter_by(username=$USERNAME).first()
      # потом меняем его пароль
      - pattern-inside: |
          user.password = request_data.get('password')
      # и коммитим
      - pattern-inside: |
          db.session.commit()
