name: Security CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  deps-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies & pip-audit
        run: |
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true

      - name: Show pip-audit report
        if: always()
        run: |
          echo "=== pip-audit results ==="
          cat pip-audit-report.json

  static-scan:
    name: Static code analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: deps-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep (verbose)
        run: |
          echo "=== RUNNING SEMGREP ==="
          semgrep --config=.semgrep/sqli.yml --validate  # <- проверка правил
          semgrep --config=.semgrep/sqli.yml VAmPI/models/ --verbose --json > semgrep-report.json || true


      - name: Show Semgrep report
        if: always()
        run: |
          echo "=== semgrep results ==="
          cat semgrep-report.json
