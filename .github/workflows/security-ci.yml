name: Security CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  deps-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies & pip-audit
        run: |
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true

      - name: Show pip-audit report
        if: always()
        run: |
          echo "=== pip-audit results ==="
          cat pip-audit-report.json

  static-scan:
    name: Static code analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: deps-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep (registry + custom rules)
        run: |
          echo "=== RUNNING SEMGREP: registry + custom for VAmPI ==="
          semgrep \
            --config=p/python \
            --config=p/owasp-top-ten \
            --config=p/ci \
            --config=.semgrep \
            --timeout 120 \
            --json --verbose \
            . > semgrep-report.json || true
            
      - name: Show Semgrep report
        if: always()
        run: |
          echo "=== semgrep results ==="
          cat semgrep-report.json
          
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: static-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-path=gitleaks-report.json

      - name: Show Gitleaks report
        if: always()
        run: |
          echo "=== gitleaks results ==="
          cat gitleaks-report.json

          
