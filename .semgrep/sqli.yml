rules:
  - id: detect-sqli-fstring
    message: |
      Потенциальная SQL-инъекция: f-строка c SELECT и подстановкой переменной.
      Используйте параметризацию (text("… WHERE username = :username"), {"username": username})
    languages: [python]
    severity: ERROR
    pattern-regex: (?i)f"SELECT.*\{.*\}.*"
