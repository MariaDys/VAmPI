rules:
  - id: sqli-raw-fstring
    patterns:
      - pattern: db.session.execute(text($X))
      - metavariable-regex:
          metavariable: $X
          regex: ".*\\{.*\\}.*"
    message: >
      Возможна SQL-инъекция через f-string в raw SQL. Лучше использовать параметризацию.
    languages: [python]
    severity: ERROR
