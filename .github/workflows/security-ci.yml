name: Security CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  deps-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies & pip-audit
        run: |
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true

      - name: Show pip-audit report
        if: always()
        run: |
          echo "=== pip-audit results ==="
          cat pip-audit-report.json

  static-scan:
    name: Static code analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: deps-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep (registry + custom rules)
        run: |
          echo "=== RUNNING SEMGREP: registry + custom for VAmPI ==="
          semgrep \
            --config=p/python \
            --config=p/owasp-top-ten \
            --config=p/ci \
            --config=.semgrep \
            --timeout 120 \
            --json --verbose \
            . > semgrep-report.json || true
            
      - name: Show Semgrep report
        if: always()
        run: |
          echo "=== semgrep results ==="
          cat semgrep-report.json
          
  secret-scan:
    name: Secret scan (Gitleaks CLI)
    runs-on: ubuntu-latest
    needs: static-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Gitleaks CLI in Docker
        run: |
          # Подмонтируем текущую директорию в /src контейнера,
          # запустим gitleaks detect и сохраним JSON-отчёт
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            zricethezav/gitleaks:8.24.3 \
            detect --no-git --source /src \
                   --report-format json \
                   --report-path /src/gitleaks-report.json || true

      - name: Show Gitleaks report
        if: always()
        run: |
          echo "=== Gitleaks Results ==="
          cat gitleaks-report.json || echo "No secrets found."

  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs: secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start vulnerable app (VAmPI)
        run: |
          docker compose up -d vampi-vulnerable
          sleep 15  # дать время подняться

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:5002'
          fail_action: false
          cmd_options: '-n'
          issue_title: ''

      - name: Tear down VAmPI
        if: always()
        run: docker compose down


