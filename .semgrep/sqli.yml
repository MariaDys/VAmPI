rules:
  - id: sqli-fstring-variable
    message: |
      Обнаружена потенциальная SQL-инъекция: 
      f-строка сохраняется в переменную и потом прокидывается в raw execute().
      Используйте параметризованные запросы, например:
        text("… WHERE username = :username"), {"username": username}
    languages: [python]
    severity: ERROR
    patterns:
      # Шаг 1: найдём f-строку в переменную
      - pattern: |
          $Q = f"...{...}..."
      # Шаг 2: в том же блоке (функции / методе) найдём её использование в execute()
      - pattern-inside: |
          db.session.execute(text($Q))
